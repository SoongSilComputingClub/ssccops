# SSCC 운영관리시스템 라벨 정의
# 일괄 생성: scripts/setup-github.sh 실행
#
# 라벨은 domain:* 뿐이다. 나머지 축은 전부 GitHub 네이티브 기능으로 대체했다:
#   - type(Epic/Story/Task/Bug/Subtask) → 조직 커스텀 Issue Type (뱃지·`type:Bug` 검색 제공)
#   - priority(P0~P3, 이전 wont)        → Projects `Priority` 필드 (P0/P1/P2/P3/Won't)
#   - status(blocked/in-review)        → Projects `Status` 필드 (Blocked/In Review 옵션)
#   - "결정 필요"                       → 라벨 대신 이슈 제목 `[DECISION]` 접두어로 구분
#     (Projects Status 필드에 "결정 대기"에 대응하는 옵션이 없어서 나온 유일한 예외 처리다.
#      자세한 내용은 GITHUB_PROJECTS_설계안.md 4절, ISSUE_TEMPLATE_가이드.md 6절 참조)
# domain:*만 라벨로 남긴 이유: 요구사항 ID 접두어와 1:1로 대응해 이슈 검색(`label:domain:OPS`)에
# 쓰이는데, Projects 필드는 이슈 목록 검색에 걸리지 않는다.

# ─── domain: 어느 영역인가 (요구사항 ID 체계와 1:1) ────
