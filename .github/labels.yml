# SSCC 운영관리시스템 라벨 정의
# 일괄 생성: scripts/setup-github.sh 실행

# ─── type: 무슨 일인가 ───────────────────────────────
# GitHub Issue Types(Epic/Feature/Task/Bug)와 병행 사용.
# Issue Type은 조직 설정에서 만들고, 라벨은 필터·색상 구분용.
- name: "type:epic"
  color: "5319E7"
  description: "Epic — 하위 이슈를 묶는 상위 목표"
- name: "type:story"
  color: "0E8A16"
  description: "Story — 사용자 관점 요구사항 (칸반 기본 카드)"
- name: "type:task"
  color: "A2EEEF"
  description: "Task — Story를 쪼갠 작업 단위"
- name: "type:bug"
  color: "D73A4A"
  description: "결함"
- name: "type:chore"
  color: "EEEEEE"
  description: "인프라·문서·설정"
- name: "type:decision"
  color: "D93F0B"
  description: "결정 필요 (ADR 후보)"

# ─── domain: 어느 영역인가 (요구사항 ID 체계와 1:1) ────
- name: "domain:AUTH"
  color: "C5DEF5"
  description: "인증·계정·권한(RBAC)"
- name: "domain:MEM"
  color: "C5DEF5"
  description: "회원·참여이력"
- name: "domain:OPS"
  color: "C5DEF5"
  description: "운영 업무·일정·승인"
- name: "domain:DATA"
  color: "C5DEF5"
  description: "데이터 단일화·이관"
- name: "domain:INFRA"
  color: "C5DEF5"
  description: "인프라·모니터링·관리자"
- name: "domain:NOTI"
  color: "C5DEF5"
  description: "공지·홍보·채널 발행"
- name: "domain:AI"
  color: "C5DEF5"
  description: "AI/OCR 홍보물 검수"
- name: "domain:FORM"
  color: "C5DEF5"
  description: "커스텀 폼·응답"
- name: "domain:LMS"
  color: "C5DEF5"
  description: "스터디·학습 활동"
- name: "domain:DOC"
  color: "C5DEF5"
  description: "문서화"

# ─── priority: MoSCoW ────────────────────────────────
- name: "P0:must"
  color: "B60205"
  description: "MVP 필수 — 없으면 시연 불가"
- name: "P1:must"
  color: "D93F0B"
  description: "MVP 필수 — Phase 1 내 완료"
- name: "P2:should"
  color: "FBCA04"
  description: "있으면 좋음 — Phase 2"
- name: "P3:could"
  color: "C2E0C6"
  description: "여유 시 — Phase 3"
- name: "wont"
  color: "EEEEEE"
  description: "이번 범위 제외 (근거 기록용)"

# ─── status: 흐름 ────────────────────────────────────
- name: "status:blocked"
  color: "FEF2C0"
  description: "다른 결정·자료를 기다림"
- name: "status:needs-decision"
  color: "FBCA04"
  description: "운영진 확정 필요"
- name: "status:in-review"
  color: "FEF2C0"
  description: "검토 중"
