name: 🗂️ Epic
description: 여러 이슈를 묶는 상위 목표 단위 (Jira의 Epic에 해당)
title: "[EPIC] "
type: Epic
body:
  - type: markdown
    attributes:
      value: |
        Epic은 **직접 작업하지 않습니다.** 하위 Story·Task·Bug를 묶어 진행률을 보는 용도입니다.
        (Sub-task를 바로 밑에 달지 않습니다 — 계층은 Epic → Story/Task/Bug → Sub-task입니다.)

        생성 후 하단 **Sub-issues** 영역에서 하위 이슈를 추가하세요.
        Projects 보드에서 Epic 단위 진행률이 자동 집계됩니다.
        하위 Story의 실제 구현(Sub-task)까지는 이 진행률에 잡히지 않으니,
        완료 여부는 Story가 실제로 Done 되었는지로 판단하세요.

  - type: input
    id: epic_id
    attributes:
      label: RFP Epic ID (문서 참조용)
      description: |
        RFP 3.0.1에 정의된 Epic ID. 이 이슈를 추적하는 고유 식별자는 GitHub 이슈 번호(#)이며,
        이 필드는 RFP 문서와 대조하기 위한 참조용입니다.
      placeholder: EP-O2
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 업무 목표
      description: 이 Epic이 달성하려는 운영상의 목표. 기능 나열이 아니라 목표를 씁니다.
      placeholder: 승인 없는 완료를 차단하고 처리 이력을 남긴다
    validations:
      required: true

  - type: dropdown
    id: problem
    attributes:
      label: 대응하는 핵심 문제
      description: 이 Epic이 해결하는 운영상의 구조적 문제
      options:
        - "① 단일 데이터 원천(SSoT) 부재"
        - "② 검수·승인 프로세스 부재"
        - "③ 문서화·인수인계 부재"
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 포함 범위
      description: 어떤 요구사항 ID들이 이 Epic에 속하는가
      placeholder: |
        OPS-010 ~ OPS-014 (상태 전이·승인)
        대응 RFP 절: 3.2, 3.3
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Epic 완료 조건
      description: 하위 이슈가 다 닫히는 것 외에, 이 Epic이 끝났다고 볼 기준
      placeholder: |
        - [ ] 승인 없이 완료 처리가 불가능함을 UAT로 검증
        - [ ] 모든 상태 전환이 감사 로그에 기록됨
    validations:
      required: true
