name: 📌 Story (요구사항)
description: 사용자 관점의 요구사항 1건 — 칸반의 기본 카드
title: "[] "
type: Story
body:
  - type: markdown
    attributes:
      value: |
        칸반 보드의 **기본 카드**입니다. 제목은 `[OPS] 업무 상태 전이 관리` 형식(도메인 태그)으로 씁니다.
        번호는 매기지 않습니다 — **GitHub이 자동으로 부여하는 이슈 번호(#)가 곧 고유 식별자**입니다.

        생성 후 상단 **Parent issue** 에서 소속 Epic을 연결하세요.

        구현이 여러 단위로 나뉘면 **Sub-task**로 쪼개세요.
        **코드 구현**이면 개발 레포(예: `ssccops-server`)에 Sub-task를 만들고 이 Story를
        Parent로 지정합니다(cross-repo). **코드가 아닌 작업**(자료 조사·문서 등)이면 이 레포의
        `3-subtask.yml`을 씁니다.

  - type: input
    id: req_id
    attributes:
      label: SRS 요구사항 ID (문서 참조용)
      description: |
        `docs/0500.요구사항정의서/`에 정의된 요구사항 ID. 브랜치·커밋·PR 추적은
        이 ID가 아니라 **GitHub 이슈 번호(#)**로 합니다 — 이 필드는 SRS 문서와 대조하기 위한 참조용입니다.
      placeholder: OPS-010
    validations:
      required: true

  - type: textarea
    id: story
    attributes:
      label: 사용자 스토리
      description: 누가 · 무엇을 · 왜
      value: |
        **누가**:
        **무엇을**:
        **왜**:
      placeholder: |
        **누가**: 운영 업무 담당자가
        **무엇을**: 업무 상태를 기획→진행→검토→완료로 전환하고
        **왜**: 승인 없이 완료되는 것을 막고 처리 이력을 남기기 위해
    validations:
      required: true

  - type: textarea
    id: ac
    attributes:
      label: 수용 기준 (Given-When-Then)
      description: |
        SRS의 AC를 그대로 옮깁니다. **이 체크박스가 곧 완료 판정 근거입니다.**
        AC가 10개를 넘으면 Story를 쪼개세요.
      value: |
        - [ ] **Given** / **When** / **Then**
        - [ ] **Given** / **When** / **Then**
      placeholder: |
        - [ ] **Given** 업무가 '기획' 상태일 때 **When** '완료'로 전환을 시도하면 **Then** 차단된다
        - [ ] **Given** '검토' 상태이고 승인자가 승인했을 때 **When** '완료'로 전환하면 **Then** 성공하고 이력에 수행자·시각이 기록된다
    validations:
      required: true

  - type: textarea
    id: rules
    attributes:
      label: 적용 업무 규칙 (BR · VR)
      description: RFP에 정의된 규칙 번호와 내용
      placeholder: |
        - BR-O03: 상태는 4단계. 역방향 전환 금지
        - BR-O05: 승인은 '검토→완료' 전이의 조건
        - VR-O01: 필수 필드 미입력 시 저장 차단
    validations:
      required: false

  - type: input
    id: source
    attributes:
      label: 근거
      description: 어느 인터뷰·문서에서 나왔는지
      placeholder: "RFP 운영관리 3.2절 / FIN-08 인터뷰 / #42"
    validations:
      required: true

  - type: textarea
    id: depends
    attributes:
      label: 선행 이슈
      description: 이 작업 전에 끝나야 하는 이슈. 없으면 "없음".
      placeholder: "#51 (OPS-001 업무 등록), #48 (AUTH 권한 체계)"
    validations:
      required: true

  - type: checkboxes
    id: done
    attributes:
      label: 완료 조건
      description: 코드 배포만으로는 완료가 아니다 — 문서까지 갱신해야 닫는다
      options:
        - label: 수용 기준(AC) 전부 통과 (개발 레포 Sub-issue 기준)
        - label: 테스트 작성 (상태 전이 · 권한 · 검증 규칙)
        - label: 권한 검증 — 허용되지 않은 역할이 접근 불가
        - label: 감사 로그 기록 (해당 시)
        - label: 관련 문서 갱신 (API 명세 · 데이터 구조)
        - label: 상대 개발자 리뷰 완료

  - type: markdown
    attributes:
      value: |
        ---
        **등록 후 Projects 필드를 채우세요**: Status · Priority · Size · Iteration · 담당
