name: 🔹 Sub-task
description: Story · Task · Bug를 쪼갠 가장 작은 실행 단위 (Jira의 Sub-task에 해당)
title: "[SUB] "
type: SubTask
body:
  - type: markdown
    attributes:
      value: |
        계층의 **가장 아래 단계**입니다. Sub-task는 스스로 하위 이슈를 가질 수 없습니다.

        생성 후 상단 **Parent issue**에서 상위 Story·Task·Bug를 반드시 지정하세요.
        (Epic을 Parent로 바로 지정하지 않습니다 — Epic 밑에는 Story/Task/Bug가 옵니다.)

        **코드 구현이 필요하면 이 템플릿이 아니라 개발 레포(예: `ssccops-server`)에 Sub-task를
        만드세요.** GitHub Sub-issues는 다른 레포의 이슈도 자식으로 연결할 수 있으므로,
        개발 레포의 Sub-task를 이 레포의 Story/Task로 Parent 지정하면 됩니다.

        이 템플릿은 **코드가 아닌** 실행 단위 — 인터뷰 개별 건, 문서 하위 항목, 자료 취합 등 —
        를 위한 것입니다.

  - type: textarea
    id: work
    attributes:
      label: 작업 내용
      description: 무엇을 하면 끝나는가. 최대한 구체적으로 — 체크리스트도 좋습니다.
      placeholder: |
        총무님께 2차 인터뷰 일정 제안(카카오톡) → 일정 확정 → 인터뷰 진행
        → 답변 원문을 docs/0200.인터뷰/2차/ 에 기록
    validations:
      required: true

  - type: input
    id: when
    attributes:
      label: 기한 · 일정
      description: 언제까지 끝내는가, 또는 언제 진행하는가. 없으면 비워둡니다.
      placeholder: "2026-08-06 14:00"
    validations:
      required: false

  - type: textarea
    id: note
    attributes:
      label: 비고
      description: 참고 사항. 없으면 비워둡니다.
    validations:
      required: false
