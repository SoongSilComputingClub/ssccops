name: 🔧 Task (작업)
description: Story로 표현되지 않는 독립 작업 단위 — 인프라·문서·설정·잡무·결정 필요 (Jira의 Task에 해당)
title: "[TASK] "
type: Task

body:
  - type: markdown
    attributes:
      value: |
        사용자 스토리로 표현하기 어려운 작업(인프라·문서·설정·인터뷰 등)에 씁니다.
        Story에 딸린 작업이면 상단 **Parent issue**에서 소속 Story·Epic을 연결하세요.

        이 Task를 더 작은 단위로 쪼개야 하면 **Sub-task**를 만들고 이 이슈를 Parent로 지정하세요.

        **코드 구현**이면 개발 레포(예: `ssccops-server`)에 Sub-task를 만들고
        cross-repo Parent를 지정하세요.

        **코드가 아닌 작업**(개별 인터뷰·자료 취합 등)이면 이 레포의
        `3-subtask.yml`을 사용합니다.

        **운영진 또는 개발팀의 확정이 필요한 사항("결정 필요")도 이 템플릿을 씁니다.**

        Jira 표준 타입에는 "Decision"이 없으므로 별도 타입을 만들지 않습니다. 대신:

        - 제목 앞에 `[DECISION]`을 붙입니다.
          - 예: `[DECISION] 회원 필수 필드 확정`
          - "운영진 확인 대기" 보드 뷰가 이 접두어로 필터링합니다.
        - 아래 **작업 종류**를 `결정 필요`로 선택합니다.
        - **선택지 · 권고안 · 결정 주체 · 결정 기한 · 영향 · 결정 결과**를 작성합니다.
        - 위 필드들은 결정 필요 항목에만 사용하며 다른 작업 종류에서는 비워둡니다.
        - 결정이 나면 `docs/decisions/`에 ADR로 옮기고 이 이슈를 닫습니다.

  - type: dropdown
    id: kind
    attributes:
      label: 작업 종류
      description: 작업의 성격을 선택하세요.
      options:
        - 인프라 (서버 · 컨테이너 · 배포)
        - Supabase 설정 (프로젝트 · RLS · 백업)
        - 모니터링 · 헬스체크
        - 문서 작성 · 정리
        - 인터뷰 · 자료 수집
        - 개발 환경 · 설정
        - 결정 필요 (운영진 · 개발팀 확정 필요)
        - 기타
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 목적
      description: |
        무엇을 위해 필요한가를 적습니다. 한 줄이면 충분합니다.

        **결정 필요 항목이면** 결정해야 할 것과 배경을 함께 적습니다.
        결정해야 할 것은 가능하면 예/아니오 또는 선택지로 답할 수 있는 형태로 작성하세요.
      placeholder: |
        정전·물리장애로 앱이 죽었을 때 5분 내 감지하기 위해

        결정 필요 예:
        회원 가입 시 학번을 필수로 받을 것인가?

        회원 데이터 모델을 확정해야 DB 스키마를 만들 수 있는데,
        학번을 필수로 받으면 졸업생·외부 참여자를 등록할 수 없다.
    validations:
      required: true

  - type: textarea
    id: work
    attributes:
      label: 작업 내용
      description: |
        수행할 작업을 체크리스트로 작성합니다.

        결정 필요 항목이면
        선택지 공유 → 논의/회의 → 확정 → ADR 작성 등의 절차를 적어도 됩니다.
      value: |
        - [ ] 
        - [ ] 
      placeholder: |
        - [ ] UptimeRobot 모니터 등록
        - [ ] 헬스체크 엔드포인트 /health 구현 (ssccops-server#31)
        - [ ] 알림 채널 연결 (이메일 · 디스코드)
    validations:
      required: true

  - type: input
    id: subissue
    attributes:
      label: 관련 Sub-task (개발 레포, 코드 작업만)
      description: |
        실제 구현이 진행되는 개발 레포의 Sub-task 이슈를 적습니다.
        코드 작업이 아니면 비워둡니다.
      placeholder: "ssccops-server#31"
    validations:
      required: false

  - type: textarea
    id: options
    attributes:
      label: 선택지 (결정 필요 항목만)
      description: |
        각 선택지와 장단점을 함께 적습니다.
        최소 2개 선택지를 권장합니다.
        결정 필요 항목이 아니면 비워둡니다.
      placeholder: |
        ### A안: 학번 필수
        - 장점: 동명이인 구분 가능, 재학생 확인 용이
        - 단점: 졸업생·외부 참여자 등록 불가

        ### B안: 학번 선택 + 자체 핸들 필수
        - 장점: 모든 유형 수용 가능
        - 단점: 동명이인 구분에 추가 로직 필요
    validations:
      required: false

  - type: input
    id: recommend
    attributes:
      label: 권고안 (결정 필요 항목만)
      description: |
        어느 쪽을 권하는지와 한 줄 이유를 적습니다.
        결정을 돕기 위한 것이며 강제는 아닙니다.
      placeholder: "B안 — 확장성 우선. 동명이인은 핸들로 구분 가능"
    validations:
      required: false

  - type: input
    id: decision_owner
    attributes:
      label: 결정 주체 (결정 필요 항목만)
      description: 누가 최종 결정을 내리는지 적습니다.
      placeholder: "회장단 / 총무 / 개발팀"
    validations:
      required: false

  - type: input
    id: deadline
    attributes:
      label: 결정 기한 (결정 필요 항목만)
      description: 이 날짜를 넘기면 권고안으로 진행합니다.
      placeholder: "2026-08-09"
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: 결정되지 않으면 생기는 영향 (결정 필요 항목만)
      description: |
        결정되지 않을 경우 무엇이 막히는지 구체적으로 적습니다.
        이 항목을 기준으로 결정 우선순위를 판단합니다.
      placeholder: |
        - 회원 테이블 스키마 확정 불가 → MEM-01~05 개발 착수 불가
        - M2(요구사항정의서 확정) 지연
    validations:
      required: false

  - type: textarea
    id: result
    attributes:
      label: 결정 결과 (결정 필요 항목만)
      description: |
        결정 후 결과를 기록합니다.
        가능하면 ADR 번호 또는 문서 경로를 함께 남깁니다.
      placeholder: |
        2026-08-08 회장단 회의에서 B안 채택.
        → docs/decisions/0004-회원-학번-선택항목.md
    validations:
      required: false

  - type: textarea
    id: rollback
    attributes:
      label: 실패 시 되돌리는 방법
      description: |
        **운영 환경을 건드리는 작업만** 작성합니다.
        해당하지 않으면 `해당 없음`이라고 적습니다.

        되돌릴 수 없는 작업이면 그 사실을 명시하세요.
        사전 백업 필요 여부를 판단하는 근거가 됩니다.
      placeholder: |
        docker compose down 후 이전 이미지 태그로 재기동
        (DB 마이그레이션 미포함이라 롤백 안전)

        또는

        해당 없음
    validations:
      required: true

  - type: checkboxes
    id: security
    attributes:
      label: 보안 확인
      description: |
        인프라·설정 작업에만 해당합니다.
        해당되는 항목을 확인하세요.
      options:
        - label: 인증정보를 저장소에 커밋하지 않았다
        - label: 환경변수는 `.env.example`에 키 이름만 기록했다
        - label: 최소 권한으로 설정했다

  - type: input
    id: doc
    attributes:
      label: 문서화 위치
      description: |
        인수인계를 위해 결과를 어디에 남길지 적습니다.

        문서 작업이면 산출물 경로를,
        결정 필요 항목이면 예정 ADR 경로(`docs/decisions/`) 또는
        `결정 후 별도 기록`을 적습니다.
      placeholder: "docs/0600.플랫폼설계/운영_모니터링.md"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---

        **등록 후 Projects 필드를 채우세요:** Status · Priority · Size · Iteration · 담당
