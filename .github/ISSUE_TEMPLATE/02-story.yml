name: 📌 Story (요구사항)
description: 사용자 관점의 요구사항 1건 — 칸반의 기본 카드
title: "[] "
labels: ["type:story"]
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        칸반 보드의 **기본 카드**입니다. 제목은 `[OPS-010] 업무 상태 전이 관리` 형식으로 씁니다.

        생성 후 상단 **Parent issue** 에서 소속 Epic을 연결하세요.
        구현이 여러 갈래로 나뉘면 **Sub-issues** 로 Task를 추가합니다.

  - type: input
    id: req_id
    attributes:
      label: 요구사항 ID
      description: 이 ID로 브랜치·커밋·PR이 추적됩니다
      placeholder: OPS-010
    validations:
      required: true

  - type: textarea
    id: story
    attributes:
      label: 사용자 스토리
      description: 누가 · 무엇을 · 왜
      value: |
        **누가**:
        **무엇을**:
        **왜**:
      placeholder: |
        **누가**: 운영 업무 담당자가
        **무엇을**: 업무 상태를 기획→진행→검토→완료로 전환하고
        **왜**: 승인 없이 완료되는 것을 막고 처리 이력을 남기기 위해
    validations:
      required: true

  - type: textarea
    id: ac
    attributes:
      label: 수용 기준 (Given-When-Then)
      description: |
        SRS의 AC를 그대로 옮깁니다. **이 체크박스가 곧 완료 판정 근거입니다.**
        AC가 10개를 넘으면 Story를 쪼개세요.
      value: |
        - [ ] **Given** / **When** / **Then**
        - [ ] **Given** / **When** / **Then**
      placeholder: |
        - [ ] **Given** 업무가 '기획' 상태일 때 **When** '완료'로 전환을 시도하면 **Then** 차단된다
        - [ ] **Given** '검토' 상태이고 승인자가 승인했을 때 **When** '완료'로 전환하면 **Then** 성공하고 이력에 수행자·시각이 기록된다
    validations:
      required: true

  - type: textarea
    id: rules
    attributes:
      label: 적용 업무 규칙 (BR · VR)
      description: RFP에 정의된 규칙 번호와 내용
      placeholder: |
        - BR-O03: 상태는 4단계. 역방향 전환 금지
        - BR-O05: 승인은 '검토→완료' 전이의 조건
        - VR-O01: 필수 필드 미입력 시 저장 차단
    validations:
      required: false

  - type: input
    id: source
    attributes:
      label: 근거
      description: 어느 인터뷰·문서에서 나왔는지
      placeholder: "RFP 운영관리 3.2절 / FIN-08 인터뷰 / #42"
    validations:
      required: true

  - type: textarea
    id: depends
    attributes:
      label: 선행 이슈
      description: 이 작업 전에 끝나야 하는 이슈. 없으면 "없음".
      placeholder: "#51 (OPS-001 업무 등록), #48 (AUTH 권한 체계)"
    validations:
      required: true

  - type: checkboxes
    id: done
    attributes:
      label: 완료 조건
      description: 코드 배포만으로는 완료가 아니다 — 문서까지 갱신해야 닫는다
      options:
        - label: 수용 기준(AC) 전부 통과
        - label: 테스트 작성 (상태 전이 · 권한 · 검증 규칙)
        - label: 권한 검증 — 허용되지 않은 역할이 접근 불가
        - label: 감사 로그 기록 (해당 시)
        - label: 관련 문서 갱신 (API 명세 · 데이터 구조)
        - label: 상대 개발자 리뷰 완료

  - type: markdown
    attributes:
      value: |
        ---
        **등록 후 Projects 필드를 채우세요**: Status · Priority · Size · Iteration · 담당
